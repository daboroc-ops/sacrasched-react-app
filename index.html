<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SacraSched</title>

    <!--
      Boot splash.

      The theme is fetched at runtime and written onto :root, so between first
      paint and that response the app would show base.css's default colours and
      then snap to the real ones. This cover sits over that gap.

      It is inline on purpose: styles in the bundle would arrive too late to
      prevent the flash they exist to hide. Colours are neutral rather than
      themed, so it never disagrees with whichever theme lands.
      App.jsx fades and removes it once the theme and parish have resolved.
    -->
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #FBF7F3;
        opacity: 1;
        transition: opacity 320ms ease;
      }
      #app-boot.app-boot--done { opacity: 0; pointer-events: none; }

      #app-boot img { width: 58px; height: 58px; animation: app-boot-pulse 1.6s ease-in-out infinite; }

      #app-boot .app-boot__track {
        position: relative;
        width: 132px;
        height: 3px;
        border-radius: 99px;
        background: rgba(28, 25, 23, .10);
        overflow: hidden;
      }
      #app-boot .app-boot__track i {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 42%;
        border-radius: 99px;
        background: #964B01;
        animation: app-boot-slide 1.15s ease-in-out infinite;
      }

      @keyframes app-boot-pulse {
        0%, 100% { opacity: 1;   transform: scale(1); }
        50%      { opacity: .72; transform: scale(.95); }
      }
      @keyframes app-boot-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(275%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot img,
        #app-boot .app-boot__track i { animation: none; }
        #app-boot .app-boot__track i { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" role="status" aria-label="Loading SacraSched">
      <img src="/favicon.svg" alt="" />
      <span class="app-boot__track"><i></i></span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
